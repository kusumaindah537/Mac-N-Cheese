<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC N CHEESE - Creamy, Cheesy, Happy!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FFC107',
                            orange: '#FF5722',
                            darkOrange: '#E64A19',
                            black: '#1A1A1A',
                            cream: '#FFF9E6',
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom Styling & Print Rules */
        .toast-animate {
            animation: slideIn 0.3s ease-out forwards, fadeOut 0.3s ease-in 2.7s forwards;
        }
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Area Cetak Resi khusus */
        @media print {
            body * {
                visibility: hidden;
            }
            #receipt-print-area, #receipt-print-area * {
                visibility: visible;
            }
            #receipt-print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                color: #000;
                background: #fff;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="font-sans bg-brand-cream text-brand-black antialiased flex flex-col min-h-screen">

    <!-- NAVBAR / HEADER -->
    <header class="sticky top-0 z-40 bg-brand-yellow/95 backdrop-blur-md shadow-md border-b-2 border-brand-orange">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo & Slogan -->
                <a href="#beranda" class="flex items-center gap-3 group">
                    <div class="bg-brand-orange text-white p-2.5 rounded-2xl shadow-md group-hover:scale-105 transition-transform">
                        <i class="fa-solid font-bold fa-bowl-food text-2xl"></i>
                    </div>
                    <div>
                        <span class="text-2xl font-extrabold tracking-wider text-brand-black block leading-none">MAC N CHEESE</span>
                        <span class="text-xs font-semibold text-brand-darkOrange italic">Creamy, Cheesy, Happy!</span>
                    </div>
                </a>

                <!-- Nav Desktop -->
                <nav class="hidden md:flex items-center gap-6 font-medium text-sm text-gray-800">
                    <a href="#beranda" class="hover:text-brand-orange transition-colors">Beranda</a>
                    <a href="#tentang" class="hover:text-brand-orange transition-colors">Tentang Produk</a>
                    <a href="#menu" class="hover:text-brand-orange transition-colors">Menu & Harga</a>
                    <a href="#keunggulan" class="hover:text-brand-orange transition-colors">Keunggulan</a>
                    <a href="#cara-pesan" class="hover:text-brand-orange transition-colors">Cara Pesan</a>
                    <a href="#kontak" class="hover:text-brand-orange transition-colors">Kontak</a>
                    <button onclick="bukaModalResi()" class="text-brand-darkOrange font-bold hover:underline flex items-center gap-1">
                        <i class="fa-solid fa-print"></i> Cetak Resi
                    </button>
                </nav>

                <!-- Action Header (Keranjang & CTA) -->
                <div class="flex items-center gap-3">
                    <button onclick="toggleCart()" class="relative p-3 bg-white hover:bg-orange-50 text-brand-black rounded-full shadow transition-all border border-yellow-200">
                        <i class="fa-solid fa-cart-shopping text-lg text-brand-orange"></i>
                        <span id="cart-badge" class="absolute -top-1 -right-1 bg-brand-orange text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
                    </button>
                    
                    <a href="#menu" class="hidden sm:inline-flex items-center gap-2 bg-brand-orange hover:bg-brand-darkOrange text-white font-bold px-5 py-2.5 rounded-full shadow-lg hover:shadow-orange-300 transition-all transform hover:-translate-y-0.5">
                        <span>Pesan Sekarang</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </a>

                    <!-- Mobile Menu Button -->
                    <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-lg text-brand-black hover:bg-yellow-200">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-gray-200 px-4 pt-2 pb-4 space-y-2">
            <a href="#beranda" onclick="toggleMobileMenu()" class="block py-2 text-gray-700 hover:text-brand-orange">Beranda</a>
            <a href="#tentang" onclick="toggleMobileMenu()" class="block py-2 text-gray-700 hover:text-brand-orange">Tentang Produk</a>
            <a href="#menu" onclick="toggleMobileMenu()" class="block py-2 text-gray-700 hover:text-brand-orange">Menu & Harga</a>
            <a href="#keunggulan" onclick="toggleMobileMenu()" class="block py-2 text-gray-700 hover:text-brand-orange">Keunggulan</a>
            <a href="#cara-pesan" onclick="toggleMobileMenu()" class="block py-2 text-gray-700 hover:text-brand-orange">Cara Pesan</a>
            <a href="#kontak" onclick="toggleMobileMenu()" class="block py-2 text-gray-700 hover:text-brand-orange">Kontak</a>
            <button onclick="toggleMobileMenu(); bukaModalResi();" class="block w-full text-left py-2 text-brand-orange font-bold">
                <i class="fa-solid fa-print mr-1"></i> Cetak Resi Pesanan
            </button>
        </div>
    </header>

    <!-- 1. HEROSECTION / BERANDA -->
    <section id="beranda" class="relative bg-gradient-to-b from-brand-yellow via-amber-300 to-brand-cream pt-12 pb-20 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid md:grid-cols-2 gap-12 items-center">
                <div class="space-y-6 text-center md:text-left">
                    <span class="inline-block bg-white/80 backdrop-blur text-brand-darkOrange font-bold px-4 py-1.5 rounded-full text-sm shadow-sm border border-orange-200">
